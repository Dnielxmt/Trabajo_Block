<!DOCTYPE html>
<html lang="es">

.producto-tarjeta {
    border: 1px solid #ccc;
    padding: 10px;

    border-radius: 8px;
}

    margin: 5px;
}

<body>

<div class="header">🛒 Mis Productos</div>

<p id="cuenta">Conectando a Metamask...</p>

<h2>Crear Nuevo Producto</h2>
<div>
    <input type="text" id="nombre" placeholder="Nombre">
    <input type="text" id="descripcion" placeholder="Descripción">
    <input type="number" id="precio" placeholder="Precio (wei)">
    <input type="number" id="stock" placeholder="Stock">
    <button id="crearProductoBtn">Crear Producto</button>
</div>

<h2>Lista de Productos</h2>
<div id="productos"></div>

<button onclick="window.history.back()">⬅ Volver atrás</button>
