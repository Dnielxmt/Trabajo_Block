<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema - DLT</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="header">Plataforma Logística Blockchain</div>

    <div class="main">
        <div id="pantalla-conexion" class="auth-box">
            <h2>Conectar con la Red Besu</h2>
            <p>Introduce la dirección del contrato desplegado:</p>
            <input type="text" id="contract-address" class="input-blockchain" placeholder="0x...">
            <button id="btn-conectar" class="btn-principal">Conectar MetaMask</button>
            <div id="logs">Esperando interacción...</div>
        </div>

        <div id="pantalla-login" class="auth-box hidden">
            <h2>Identificación de Usuario</h2>
            <p>Tu Wallet: <br><strong id="user-wallet" style="font-size: 12px;">0x...</strong></p>
            <div style="background: #e8f8f5; padding: 20px; border-radius: 10px; margin: 20px 0;">
                <p>Rol detectado por Smart Contract:</p>
                <h3 id="detected-role" style="color: #2ecc71;">Cargando rol...</h3>
            </div>
            <button id="btn-confirmar" class="btn-principal">Entrar al Panel</button>
            <button id="btn-cambiar" style="background:none; border:none; color:#3498db; cursor:pointer; margin-top:10px;">Cambiar de cuenta en MetaMask</button>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 Supermercado - Gestión DLT Fase 2</p>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <!-- <script src="app.js"></script> -->
     <script src="js/abi.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
