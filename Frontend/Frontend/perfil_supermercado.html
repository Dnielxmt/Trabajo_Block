<script>
window.onload = async () => {
    await conectar();

    if (!cuentaActual) {
        document.getElementById("cuenta").innerText =
            "No conectado";
        return;
    }

    document.getElementById("cuenta").innerText =
        "Conectado como: " + cuentaActual;

    console.log("¿Proveedor?", await esProveedor());
};
</script>
