<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil Owner</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== SECCIÓN SUPERIOR ===== */
        .header {
            background-color: #2ecc71;
            padding: 30px;
            text-align: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* ===== CONTENIDO PRINCIPAL ===== */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        /* ===== BOTONES ===== */
        .btn {
            padding: 18px 28px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            transition: background-color 0.3s, transform 0.2s;
            min-width: 220px;
        }

        .btn:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        /* ===== GRUPO DE COLUMNAS ===== */
        .columns {
            display: flex;
            gap: 40px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .column h3 {
            margin-bottom: 10px;
            color: #333;
        }

        /* ===== FOOTER ===== */
        .footer {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .footer a {
            color: #2ecc71;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .header-link {
            color: rgb(43, 6, 249);
            text-decoration: none;
        }

        .header-link:hover {
            text-decoration: underline;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <!-- SECCIÓN SUPERIOR -->
    <div class="header">
        <a href="perfil_owner.html" class="header-link">
            Bienvenido owner
        </a>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main">
        <div class="panel">

            <!-- BOTÓN SUPERIOR -->
            <button class="btn" onclick="location.href='politica_descuento.html'">
                ⚙️ Cambiar política de descuento
            </button>

            <!-- DOS COLUMNAS -->
            <div class="columns">

                <!-- COLUMNA SUPERMERCADO -->
                <div class="column">
                    <h3>Supermercado</h3>
                    <button class="btn" onclick="location.href='crear_supermercado.html'">
                        ➕ Crear supermercado
                    </button>
                    <button class="btn" onclick="location.href='borrar_supermercado.html'">
                        ❌ Borrar supermercado
                    </button>
                </div>

                <!-- COLUMNA PROVEEDOR -->
                <div class="column">
                    <h3>Proveedor</h3>
                    <button class="btn" onclick="location.href='crear_proveedor.html'">
                        ➕ Crear proveedor
                    </button>
                    <button class="btn" onclick="location.href='borrar_proveedor.html'">
                        ❌ Borrar proveedor
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <div>
            <a href="#">Preguntas frecuentes</a>
            <a href="#">Normas de la app</a>
            <a href="#">Ponte en contacto con nosotros</a>
        </div>
        <p style="margin-top: 10px; font-size: 12px;">
            © 2026 Supermercado - Todos los derechos reservados
        </p>
    </div>

</body>
</html>
