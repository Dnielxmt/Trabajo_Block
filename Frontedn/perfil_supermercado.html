<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil Supermercado</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== SECCIÓN SUPERIOR ===== */
        .header {
            background-color: #2ecc71;
            padding: 30px;
            text-align: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* ===== CONTENIDO PRINCIPAL ===== */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== GRID DE BOTONES ===== */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .btn {
            padding: 20px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            transition: background-color 0.3s, transform 0.2s;
            min-width: 220px;
        }

        .btn:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        /* ===== FOOTER ===== */
        .footer {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .footer a {
            color: #2ecc71;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .header-link {
            color: rgb(43, 6, 249);
            text-decoration: none;
        }

        .header-link:hover {
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <a href="perfil_supermercado.html" class="header-link">
            Bienvenido supermercado
        </a>
    </div>

    <!-- BOTONES -->
    <div class="main">
        <div class="buttons-grid">
            <button class="btn" onclick="location.href='pedidos.html'">
                🧾 Pedidos
            </button>

            <button class="btn" onclick="location.href='productos.html'">
                🛒 Productos
            </button>

            <button class="btn" onclick="location.href='carrito.html'">
                🧺 Carrito
            </button>

            <button class="btn" onclick="location.href='proveedores.html'">
                🚚 Proveedores
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <div>
            <a href="#">Preguntas frecuentes</a>
            <a href="normas_supermercado.html">Normas de la app</a>
            <a href="#">Ponte en contacto con nosotros</a>
        </div>
        <p style="margin-top: 10px; font-size: 12px;">
            © 2026 Supermercado - Todos los derechos reservados
        </p>
    </div>

</body>
</html>
